[build]
builder = "nixpacks"
buildCommand = "echo 'BUILD v8-seed-fix commit 0d082f3' && pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
startCommand = "python manage.py migrate --noinput && gunicorn Egy360.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"
