# Railway deployment configuration - Dec 25 2024
[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn Egy360.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --access-logfile - --error-logfile - --log-level debug"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
