# Railway deployment configuration - Dec 25 2024
[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate --noinput 2>&1 || echo 'Migration skipped' && python manage.py collectstatic --noinput 2>&1 && gunicorn Egy360.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
