{% extends 'base.html' %}

{% block title %}Too Many Requests - Egy360{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body text-center py-5">
                    <i class="fas fa-clock fa-4x text-warning mb-4"></i>
                    <h2 class="mb-3">Too Many Requests</h2>
                    <p class="text-muted mb-4">{{ message|default:"You've made too many requests. Please wait a moment and try again." }}</p>
                    <a href="{% url 'homepage' %}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
